# Dual-theme glassmorphic look. Both palettes are defined, so the app follows the visitor's system preference and
# anyone can switch Light / Dark / System from the ⋮ menu › Settings. src/ui/theme.py layers the frosted-glass CSS
# (with matching tokens) on top of whichever theme is active. Fonts: Geist (OFL) and JetBrains Mono.

[theme]
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, monospace"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["2.4rem", "1.55rem", "1.2rem", "1.05rem", "1rem", "0.95rem"]
metricValueFontWeight = 600
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false

[theme.light]
primaryColor = "#0D6E66"
backgroundColor = "#E9EFF6"
secondaryBackgroundColor = "#F7F9FC"
textColor = "#08111F"
borderColor = "#D3DCE7"
dataframeBorderColor = "#DCE3EC"
dataframeHeaderBackgroundColor = "#F1F5F9"
linkColor = "#0D6E66"
codeBackgroundColor = "#F1F5F9"
blueColor = "#2346B8"
greenColor = "#0D6E66"
orangeColor = "#C2410C"
yellowColor = "#B7791F"
redColor = "#B42318"
violetColor = "#6D28D9"
chartCategoricalColors = ["#0D6E66", "#2346B8", "#C2410C", "#B7791F", "#6D28D9", "#0E7490", "#4E5B6E"]

[theme.light.sidebar]
backgroundColor = "#F2F6FA"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#D3DCE7"

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#05070C"
secondaryBackgroundColor = "#121722"
textColor = "#F4F7FB"
borderColor = "#262E3B"
dataframeBorderColor = "#232A36"
dataframeHeaderBackgroundColor = "#141A25"
linkColor = "#2DD4BF"
codeBackgroundColor = "#121722"
blueColor = "#9DB6FF"
greenColor = "#2DD4BF"
orangeColor = "#FB923C"
yellowColor = "#F5C065"
redColor = "#FF8A8A"
violetColor = "#C4A8FF"
chartCategoricalColors = ["#2DD4BF", "#9DB6FF", "#FB923C", "#F5C065", "#C4A8FF", "#67E8F9", "#B3BDCB"]

[theme.dark.sidebar]
backgroundColor = "#0A0D14"
secondaryBackgroundColor = "#121722"
borderColor = "#262E3B"

[server]
maxUploadSize = 15

[browser]
gatherUsageStats = false
